; =====================================================================
;  T-CameraPlus-S3  Dashcam (行车记录器)
;  Target board: LILYGO T-CameraPlus-S3  V1.0 / V1.1
;  MCU: ESP32-S3 | Flash 16MB | PSRAM 8MB (QSPI)
;
;  Build:   pio run
;  Flash:   pio run -t upload
;  Monitor: pio device monitor
;
;  The combined single-binary (bootloader+partitions+app) is produced by
;  merge_bin.py after every build, in .pio/bin/  (see [env] extra_scripts).
; =====================================================================

[platformio]
default_envs = dashcam
src_dir = ./
boards_dir = ../../boards

[env:dashcam]
platform  = espressif32 @ 6.5.0      ; arduino-esp32 core 2.0.14 (LILYGO-validated)
board     = lilygo_t_cameraplus_esp32s3
framework = arduino

; ---- Chip / flash / psram -------------------------------------------
board_build.mcu              = esp32s3
board_build.f_cpu            = 240000000L
board_build.flash_mode       = qio
board_build.f_flash          = 80000000L
board_build.arduino.memory_type = qio_qspi   ; Flash QIO + PSRAM QSPI (this board)
board_upload.flash_size      = 16MB
board_upload.maximum_size    = 16777216
board_build.partitions       = partitions.csv

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time

; ---- Build flags ----------------------------------------------------
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1     ; serial log over native USB (set 0 to use UART pins)
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

; ---- Libraries (pulled from the PlatformIO registry) ----------------
lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bitbank2/JPEGDEC @ ^1.6.2
    lewisxhe/XPowersLib @ ^0.2.6
    mathertel/OneButton @ ^2.5.0
; esp32-camera, SD, FS, SPI, Wire are bundled with the arduino-esp32 core.

; ---- Produce a single flashable .bin after each build ---------------
extra_scripts = post:./merge_bin.py
merge_bin_output_file = T-CameraPlus-S3_Dashcam.bin
merge_bin_output_dir  = firmware_out
